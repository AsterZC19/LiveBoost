services:
  liveboost:
    image: ghcr.io/asterzc19/liveboost:latest
    container_name: liveboost
    restart: unless-stopped
    env_file: .env
    environment:
      - STATE_FILE=/data/state.json
    ports:
      - "8000:8000"
    volumes:
      - liveboost-data:/data

volumes:
  liveboost-data:
